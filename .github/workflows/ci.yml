name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Only core + dev. The optional extras of later phases are never installed in CI,
      # which also proves that the core works without them.
      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests with coverage
        run: pytest --cov --cov-branch --cov-report=term-missing --cov-fail-under=90

      - name: Validate scenarios
        run: python -m reliability.cli validate-scenarios

      # The release gate is part of CI: any exit code other than 0 fails the job.
      - name: Release gate (mock provider)
        run: python -m reliability.cli run --provider mock --html --report-dir reports

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-reports
          path: |
            reports/*.json
            reports/*.html
          if-no-files-found: warn

  history:
    # Trends need persisted summaries; CI runs are stateless. Append one compact line per
    # main-branch push to history/runs.jsonl on a dedicated `history` branch.
    needs: core
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Append run summary to the history branch
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin history; then
            git worktree add -B history ../history-wt FETCH_HEAD
          else
            git worktree add --detach ../history-wt
            git -C ../history-wt checkout --orphan history
            git -C ../history-wt rm -rf --quiet .
          fi
          mkdir -p ../history-wt/history
          python -m reliability.cli run --provider mock --report-dir reports \
            --history-file ../history-wt/history/runs.jsonl
          git -C ../history-wt add history/runs.jsonl
          git -C ../history-wt commit -m "history: ${GITHUB_SHA::7}"
          git -C ../history-wt push origin history
