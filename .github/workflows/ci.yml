name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (core + dev only; [live]/[compare] are never installed in CI)
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests with coverage
        run: pytest --cov --cov-branch --cov-report=term-missing --cov-fail-under=90

      - name: Validate scenarios
        run: python -m reliability.cli validate-scenarios

      - name: Release gate (mock provider)
        run: python -m reliability.cli run --provider mock --report-dir reports
